# Render 무료 플랜용 설정. 대시보드에서 "New > Blueprint"로 이 파일을 가리키면 된다.
#
# ⚠️ 무료 웹 서비스는 **15분간 요청이 없으면 잠든다.** 반드시 UptimeRobot 같은
# 모니터로 5분마다 `https://<서비스>.onrender.com/`을 때리도록 설정해야 한다.
# 이 저장소의 keep-alive 서버가 그 요청을 받는다.
services:
  - type: web
    name: discord-music-bot
    runtime: node
    plan: free
    region: singapore
    # Node 내장 SQLite(node:sqlite)를 쓰므로 23.4 미만에서는 뜨지 않는다.
    buildCommand: npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      # auto = play-dl로 조회하고, 스트림이 막히면 yt-dlp로 자동 전환한다.
      # playdl로 고정하지 말 것 — 2026년 8월 현재 play-dl은 재생 URL을 풀지 못한다.
      # (README "오디오 엔진 선택"의 경고 참고)
      - key: AUDIO_ENGINE
        value: auto
      # Render 대시보드의 Secret Files로 cookies.txt를 올리면 이 경로에 놓인다.
      # 파일이 없으면 경고만 남기고 그대로 동작한다.
      - key: YTDLP_COOKIES
        value: /etc/secrets/cookies.txt
      # 대시보드에서 직접 채운다. 저장소에 올리지 않는다.
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: YOUTUBE_COOKIE
        sync: false
